<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sinaliza.ai · API .NET de abrigos e rotas de evacuação">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="320" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#25104D"/>
    <g filter="url(#blur)">
      <ellipse cx="160" cy="120" rx="260" ry="150" fill="#C2286B"/>
      <ellipse cx="300" cy="300" rx="220" ry="110" fill="#FAB940" opacity="0.85"/>
      <ellipse cx="1050" cy="40" rx="260" ry="140" fill="#5B1C2E"/>
      <ellipse cx="980" cy="330" rx="240" ry="120" fill="#C2286B" opacity="0.7"/>
    </g>
  </g>
  <!-- estrela de 4 pontas -->
  <path transform="translate(150 160) scale(1.6)" fill="#FAB940"
        d="M0,-40 C6,-6 6,-6 40,0 C6,6 6,6 0,40 C-6,6 -6,6 -40,0 C-6,-6 -6,-6 0,-40Z"/>
  <text x="250" y="168" fill="#F7D9FC" font-family="Gloock, 'DM Serif Display', Georgia, 'Times New Roman', serif"
        font-size="92" letter-spacing="1">Sinaliza.ai</text>
  <text x="254" y="222" fill="#FAB940" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="30" font-weight="600">
    API .NET · Abrigos e Rotas de Evacuação
  </text>
  <text x="254" y="262" fill="#F7D9FC" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="20" opacity="0.85">
    Global Solution 2026/2 · CitizenTech · FIAP
  </text>
</svg>
