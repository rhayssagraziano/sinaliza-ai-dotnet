<text class="tp" x="288" y="197" text-anchor="end">NUMBER(1)</text>
<text class="col" x="38" y="218">CRIADO_EM</text>
<text class="tp" x="288" y="218" text-anchor="end">TIMESTAMP(7)</text>
</g>
<path class="lig" d="M324,136 H424"/>
<text class="card" x="332" y="128">1</text>
<text class="card" x="410" y="128">N</text>
<text class="rot" x="374" y="154" text-anchor="middle">tem</text>
<text class="legenda" x="24" y="378">Um abrigo tem várias rotas de evacuação (1:N). ON DELETE CASCADE: apagar o abrigo apaga as rotas dele.</text>
