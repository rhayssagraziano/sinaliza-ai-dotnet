<text class="tp" x="288" y="134" text-anchor="end">NUMBER(10) &gt; 0</text>
<rect class="zebra" x="1.5" y="141" width="297" height="21"/>
<text class="col" x="38" y="155">TEMPO_ESTIMADO_MIN</text>
<text class="tp" x="288" y="155" text-anchor="end">NUMBER(10) &gt; 0</text>
<text class="col" x="38" y="176">ACESSIVEL</text>
<text class="tp" x="288" y="176" text-anchor="end">NUMBER(1)</text>
<rect class="zebra" x="1.5" y="183" width="297" height="21"/>
