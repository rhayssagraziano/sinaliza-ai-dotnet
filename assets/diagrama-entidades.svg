    .zebra { fill: #FCF0FE; }
    .lig { stroke: #5B1C2E; stroke-width: 2; fill: none; }
    .tracejada { stroke-dasharray: 6 4; }
    .card { fill: #C2286B; font-size: 12.5px; font-weight: 700; }
    .rot  { fill: #5B1C2E; font-size: 11px; font-style: italic; }
    .titulo { fill: #25104D; font-size: 17px; font-weight: 700; }
    .legenda { fill: #5B1C2E; font-size: 11px; }
  </style>
  </defs>
  <rect class="fundo" width="748" height="396" rx="16"/>
<text class="titulo" x="24" y="34">Sinaliza.ai · Modelo da API .NET</text>
<g transform="translate(24 56)">
