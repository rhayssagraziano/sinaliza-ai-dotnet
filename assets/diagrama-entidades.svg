<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 396" width="748" height="396"
     font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Diagrama de entidades: ABRIGO 1:N ROTA_EVACUACAO">
  <defs>
  <style>
    .fundo { fill: #ffffff; }
    .cx  { fill: #ffffff; stroke: #C2286B; stroke-width: 1.6; }
