<rect class="zebra" x="1.5" y="267" width="297" height="21"/>
<text class="col" x="38" y="281">CRIADO_EM</text>
<text class="tp" x="288" y="281" text-anchor="end">TIMESTAMP(7)</text>
</g>
<g transform="translate(424 56)">
